name: Bootstrap production source

on:
  push:
    paths:
      - ".github/workflows/bootstrap-production.yml"

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore production source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/workplace.tar.gz.b64.part* | base64 --decode > /tmp/workplace.tar.gz
          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .bootstrap \
            ! -name .github \
            -exec rm -rf {} +
          tar -xzf /tmp/workplace.tar.gz -C .
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-production.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

      - name: Commit production source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: production Supabase workforce and inventory system"
          git push origin HEAD:main
